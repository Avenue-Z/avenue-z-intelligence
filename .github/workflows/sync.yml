name: Manually check application refresh
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analytics-source-sync
  cancel-in-progress: false
jobs:
  refresh:
    # A manual operational check; Vercel owns the production schedule.
    if: vars.SOURCE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync-cloud.mjs
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
